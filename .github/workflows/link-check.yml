name: Link check

on:
  schedule:
    - cron: '7 9 * * *' # daily 09:07 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Non-zero exit on dead links → GitHub emails the owner automatically.
      - name: Verify published links
        run: python tools/check_links.py
